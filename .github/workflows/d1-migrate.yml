name: Apply D1 migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply D1 migrations to the existing database
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply jumjumgames --remote

      - name: Verify category count
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute jumjumgames --remote --command "SELECT COUNT(*) AS total_categories FROM categories;"

      - name: Verify category distribution by audience
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute jumjumgames --remote --command "SELECT audience, COUNT(*) AS category_count FROM categories GROUP BY audience ORDER BY audience;"

      - name: Verify settings count
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute jumjumgames --remote --command "SELECT COUNT(*) AS total_settings FROM game_settings;"

      - name: Verify player and family schema
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute jumjumgames --remote --command "SELECT COUNT(*) AS player_schema_tables FROM sqlite_master WHERE type = 'table' AND name IN ('player_profiles','adult_player_profiles','family_groups','child_profiles','protected_age_records','parental_settings','parent_consents','player_progress','stage_results','reward_ledger','admin_roles','parent_device_links');"
